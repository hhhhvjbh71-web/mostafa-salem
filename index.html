  <style>

    #iraqi-loader {

      inset: 0;
      z-index: 99999;
      background: var(--ld-bg);
      display: flex;
      flex-direction: column;
      align-items: center;

      overflow: hidden;
      font-family: 'Poppins', 'Tajawal', 'Inter', sans-serif;

      transition: opacity 0.85s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #iraqi-loader.ld-hide {
      opacity: 0;
      pointer-events: none;
    }

    /* Background gradient */
    #ld-bg-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 38%, rgba(14, 165, 233, 0.12) 0%, transparent 45%),
        radial-gradient(ellipse 60% 50% at 92% 100%, rgba(34, 197, 94, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 6% 92%, rgba(249, 115, 22, 0.08) 0%, transparent 50%),
        linear-gradient(165deg, #FBF9F4 0%, #F5F1E8 55%, #EFF8FF 100%);
      pointer-events: none;
    }

    /* Soft "notebook" dot grid — subtle, educational, not maths-specific */
    #ld-dot-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(var(--ld-dot) 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      opacity: 0;
      animation: ldGridIn 1.2s ease 0.1s forwards;
    }
    @keyframes ldGridIn { to { opacity: 1; } }

    /* Glow orbs */
    #ld-glow-orbs { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .ld-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0;
      animation: ldOrbPulse var(--ob-dur, 8s) ease-in-out infinite;
      animation-delay: var(--ob-del, 0s);
    }
    .ld-orb-1 { width:320px; height:320px; top:-80px; right:-60px; background: radial-gradient(circle, rgba(14,165,233,0.18) 0%, transparent 70%); --ob-dur:9s; --ob-del:0s; }
    .ld-orb-2 { width:260px; height:260px; bottom:-60px; left:-40px; background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 70%); --ob-dur:11s; --ob-del:1.5s; }
    .ld-orb-3 { width:200px; height:200px; top:28%; right:6%; background: radial-gradient(circle, rgba(249,115,22,0.12) 0%, transparent 70%); --ob-dur:10s; --ob-del:2s; }
    .ld-orb-4 { width:180px; height:180px; top:18%; left:8%; background: radial-gradient(circle, rgba(56,189,248,0.12) 0%, transparent 70%); --ob-dur:12s; --ob-del:0.8s; }
    @keyframes ldOrbPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Floating English-learning elements (replaces old maths symbols) */
    #ld-eng-floats { position: absolute; inset: 0; pointer-events: none; user-select: none; overflow: hidden; }
    .ld-float {
      position: absolute;
      font-family: 'Poppins', 'Inter', sans-serif;
      font-weight: 700;
      opacity: 0;
      animation: ldFloatDrift var(--fl-dur, 7s) ease-in-out infinite;
      animation-delay: var(--fl-del, 0s);
      font-size: var(--fl-sz, 14px);
      letter-spacing: 0.02em;
    }
    .lf1 { top: 10%; left: 6%;   color: var(--ld-blue);      --fl-sz: 24px; --fl-dur: 8s;   --fl-del: .2s; }
    .lf2 { top: 16%; right: 8%;  color: var(--ld-green-dark); --fl-sz: 15px; --fl-dur: 7s;  --fl-del: 1s; }
    .lf3 { bottom: 24%; left: 5%; color: var(--ld-orange);   --fl-sz: 13px; --fl-dur: 9s;   --fl-del: .6s; }
    .lf4 { top: 40%; left: 3%;  color: var(--ld-blue-dark);  --fl-sz: 14px; --fl-dur: 8.5s; --fl-del: 1.6s; }
    .lf5 { bottom: 18%; right: 6%; color: var(--ld-green);   --fl-sz: 14px; --fl-dur: 7.5s; --fl-del: .9s; }
    .lf6 { top: 8%; right: 24%; color: var(--ld-blue);       --fl-sz: 18px; --fl-dur: 8s;   --fl-del: 2s; }
    .lf7 { bottom: 12%; left: 26%; color: var(--ld-orange);  --fl-sz: 13px; --fl-dur: 9s;   --fl-del: 1.3s; }
    .lf8 { top: 62%; right: 3%; color: var(--ld-blue-dark);  --fl-sz: 12px; --fl-dur: 8.5s; --fl-del: .4s; }

    @keyframes ldFloatDrift {
      0%, 100% { opacity: 0; transform: translateY(0) rotate(0deg); }
      15%, 85% { opacity: .45; }
      50% { opacity: .6; transform: translateY(-14px) rotate(-2deg); }
    }

    #ld-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 24px;
    }

    /* ── Illustration: a bird celebrating atop a stack of books ─── */
    #ld-illustration-wrap {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;

    @keyframes ldIllustIn {

      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    #ld-illustration-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;

    @keyframes ldGlowPulse {
      0%, 100% { transform: scale(1); opacity: .8; }
      50% { transform: scale(1.08); opacity: 1; }

    @keyframes ldBirdHop {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30%      { transform: translateY(-9px) rotate(-2deg); }
      55%      { transform: translateY(0) rotate(1deg); }
    }
    #ld-wing-right { animation: ldWingFlapR 1.8s ease-in-out infinite; transform-origin: 152px 102px; }

    @keyframes ldWingFlapR { 0%,100% { transform: rotate(0deg); } 40% { transform: rotate(-12deg); } 60% { transform: rotate(4deg); } }
    @keyframes ldWingFlapL { 0%,100% { transform: rotate(0deg); } 40% { transform: rotate(10deg); }  60% { transform: rotate(-3deg); } }
    .ld-sparkle { animation: ldSparkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ld-sparkle-2 { animation-delay: .35s; }
    .ld-sparkle-3 { animation-delay: .65s; }
    @keyframes ldSparkle { 0%,100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
    .ld-motion-line { animation: ldMotionFade 1.8s ease-in-out infinite; }
    @keyframes ldMotionFade { 0%,100% { opacity: .12; } 50% { opacity: .5; } }

    #ld-brand {
      text-align: center;
      opacity: 0;
      animation: ldFadeUp .7s ease .5s forwards;

    @keyframes ldFadeUp {

    }

      margin-bottom: 6px;
    }

    #ld-name {
      font-family: 'Poppins', 'Tajawal', sans-serif;
      font-size: clamp(1.45rem, 5vw, 2.3rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 0;
      background: linear-gradient(120deg, var(--ld-blue2) 0%, var(--ld-blue) 50%, var(--ld-blue-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    #ld-deco-line { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0; }
    .ld-line-seg { height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--ld-orange), transparent); }
    .ld-deco-diamond { width: 7px; height: 7px; background: var(--ld-orange); transform: rotate(45deg); border-radius: 2px; }

    #ld-tagline {
      font-size: clamp(0.95rem, 2.6vw, 1.2rem);
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--ld-orange);
      text-transform: uppercase;
      margin: 0;
    }

    #ld-progress-area {
      width: min(280px, 70vw);
      margin-top: 24px;
      opacity: 0;
      animation: ldFadeUp .7s ease .8s forwards;
    }
    #ld-bar-track {
      width: 100%;
      height: 6px;
      border-radius: 99px;
      background: rgba(14, 165, 233, 0.14);
      overflow: hidden;
      position: relative;
    }
    #ld-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--ld-blue) 0%, var(--ld-green) 60%, var(--ld-orange) 100%);
      transition: width .5s cubic-bezier(.4,0,.2,1);
      position: relative;
      overflow: hidden;
    }
    #ld-bar-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
      animation: ldShimmer 1.4s ease-in-out infinite;
    }
    @keyframes ldShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    #ld-msg {
      margin: 10px 0 0;
      font-size: 0.85rem;
      color: var(--ld-muted);
      font-weight: 600;
      text-align: center;
      font-family: 'Inter', 'Tajawal', sans-serif;
    }

    @media (max-width: 480px) {
      #ld-illustration-wrap { width: 145px; height: 145px; }
      #ld-bird-svg { width: 135px; height: 135px; }
      #ld-name { font-size: 1.45rem; }
      #ld-eng-title { font-size: 0.66rem; letter-spacing: 2px; }
      #ld-tagline { font-size: 0.95rem; }
      .ld-float { display: none; }
      .lf1, .lf2, .lf5 { display: block; }
    }

    }

  <script>
    (function () {
      var loader = document.getElementById('iraqi-loader');
      var bar = document.getElementById('ld-bar-fill');
      var msg = document.getElementById('ld-msg');
      if (!loader) return;

      var msgs = [
        'نجهّز عالم اللغة الإنجليزية…',
        'نرسم المفاهيم…',
        'نرتّب القواعد…',
        'نجهّز الدروس…',
        'كل شيء جاهز.'
      ];
      var pcts = [18, 40, 63, 84, 97];
      var i = 0;

      function step() {
        if (i >= msgs.length) return;
        if (bar) bar.style.width = pcts[i] + '%';
        if (msg) msg.textContent = msgs[i];
        i++;
      }

      step();
      var t1 = setTimeout(step, 900);
      var t2 = setTimeout(step, 1900);
      var t3 = setTimeout(step, 3100);
      var t4 = setTimeout(step, 4400);

      function hide() {
        if (!loader || !loader.parentNode) return;
        if (bar) bar.style.width = '100%';
        setTimeout(function () {
          loader.classList.add('ld-hide');
          if (typeof window.startHeroTypewriter === 'function') {
            setTimeout(window.startHeroTypewriter, 300);
          }
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 900);
        }, 300);
      }

      var minAt = Date.now() + 6000;
      function tryHide() {
        var delay = Math.max(0, minAt - Date.now());
        setTimeout(hide, delay);
      }

      if (document.readyState === 'complete') {
        tryHide();
      } else {
        window.addEventListener('load', tryHide);
      }

      setTimeout(function () {
        if (loader && loader.parentNode) hide();
      }, 12000);
    })();
  </script>

  <script>
    (function () {
      var _H = 'b8e9680e7741d4c20577be2e153e7eb8863f6831d1d86689d0234c0628ec2c4b';
      var FILE = 'dashboard.html';

      async function _digest(s) {
        try {
          var buf = new TextEncoder().encode(s);
          var hashBuf = await crypto.subtle.digest('SHA-256', buf);
          return Array.from(new Uint8Array(hashBuf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        } catch (e) {
          return btoa(s);
        }
      }

      window.openDashModal = function () {
        var ov = document.getElementById('dashPwOverlay'), inp = document.getElementById('dashPwInput'), err = document.getElementById('dashPwErr');
        if (!ov) return; ov.classList.add('open');
        if (err) err.style.display = 'none';
        if (inp) { inp.value = ''; setTimeout(function () { inp.focus(); }, 120); }
      };
      window.closeDashModal = function () { var ov = document.getElementById('dashPwOverlay'); if (ov) ov.classList.remove('open'); };
      window.verifyDashPw = async function () {
        var inp = document.getElementById('dashPwInput'), err = document.getElementById('dashPwErr'), modal = document.getElementById('dashPwModal');
        var pw = inp ? inp.value.trim() : '';
        var h = await _digest(pw);
        if (h === _H || pw === atob('MjAyMDIw') || pw === '202020') {
          if (err) err.style.display = 'none';
          localStorage.setItem('alsaqr_current_user', JSON.stringify({

        } else {
          if (err) err.style.display = 'block';
          if (modal) { modal.classList.remove('pw-shake'); void modal.offsetWidth; modal.classList.add('pw-shake'); }
          if (inp) { inp.value = ''; inp.focus(); }
        }
      };
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDashModal(); });
    })();
  </script>
